sources:
  "5.0.0":
    - url: "https://github.com/opencv/opencv/archive/refs/tags/5.0.0.tar.gz"
      sha256: "b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095"
    - url: "https://github.com/opencv/opencv_contrib/archive/refs/tags/5.0.0.tar.gz"
      sha256: "c58f6344170c39abf187c56f3843b59cab1fd3e89cf19ba2ce25dc061659b27f"
patches:
  "5.0.0":
    - patch_file: "patches/5.0.0-0001-android-install-layout.patch"
      patch_description: "Honor install layout from conan if Android"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0002-fix-zlib-static-android.patch"
      patch_description: "Fix discovery of zlib static if Android"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0003-fix-libwebp-find.patch"
      patch_description: "Add find_package for libwebp"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0004-tracking-no-plot-deps.patch"
      patch_description: "Fix requirements of tracking module"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0005-find-openexr.patch"
      patch_description: "Robust discovery & injection of OpenEXR"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0006-find-ade.patch"
      patch_description: "Robust discovery & injection of ade"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0007-remove-dead-caffe-io.patch"
      patch_description: "Remove the dead Caffe NetParameter (de)serialization code left behind by the upstream removal of the Caffe importer API; keep only the generic proto read helpers still reused by the TensorFlow loader"
      patch_type: "conan"
    - patch_file: "patches/5.0.0-0008-mlas-hgemm-supported-fallback.patch"
      patch_description: "Provide a portable MlasHGemmSupported() fallback: the bundled MLAS subset only vendors SGEMM kernels, but compute.cpp unconditionally references this symbol for the (also unvendored) half-precision GQA path, leaving opencv_dnn unlinkable on every architecture"
      patch_type: "conan"
